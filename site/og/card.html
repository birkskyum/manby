<!doctype html>
<!--
	The social card for links to the site (public/og.png) and the GitHub
	repository (og/github-social.png). og/render.sh screenshots it with
	headless Chrome at the size each needs; the layout follows the window.
	Colors are the site's dark theme, from src/styles/tokens.css.
-->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>manby card</title>
		<style>
			@font-face {
				font-family: 'Inter';
				src: url('../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2')
					format('woff2');
				font-weight: 100 900;
			}
			:root {
				--bg: #1b1b1f;
				--bg-soft: #202127;
				--text-1: #dfdfd6;
				--text-2: #98989f;
				--brand-1: #a8b1ff;
				--brand-2: #5c73e7;
				--other: #898781;
			}
			* {
				box-sizing: border-box;
				margin: 0;
			}
			html,
			body {
				width: 100vw;
				height: 100vh;
				overflow: hidden;
				background: var(--bg);
				color: var(--text-1);
				font-family: 'Inter', sans-serif;
			}
			body {
				display: flex;
				flex-direction: column;
				padding: 64px 72px 60px;
				background:
					radial-gradient(60% 80% at 92% 8%, rgba(92, 115, 231, 0.22), transparent 70%),
					var(--bg);
			}
			.brand {
				display: flex;
				align-items: center;
				gap: 16px;
				font-size: 40px;
				font-weight: 650;
				letter-spacing: -0.01em;
			}
			.brand svg {
				width: 52px;
				height: 52px;
			}
			h1 {
				margin-top: 48px;
				font-size: 92px;
				line-height: 1.02;
				font-weight: 720;
				letter-spacing: -0.025em;
			}
			h1 span {
				color: var(--brand-1);
			}
			.pitch {
				margin-top: 20px;
				font-size: 30px;
				line-height: 1.3;
				text-wrap: balance;
				color: var(--text-2);
			}
			.chart {
				margin-top: auto;
				display: grid;
				grid-template-columns: 190px 1fr;
				row-gap: 14px;
				align-items: center;
				font-size: 28px;
			}
			.chart .title {
				grid-column: 1 / -1;
				font-size: 24px;
				color: var(--text-2);
			}
			.chart .name {
				color: var(--text-1);
			}
			.row {
				display: flex;
				align-items: center;
				gap: 14px;
				color: var(--text-2);
				font-variant-numeric: tabular-nums;
			}
			.bar {
				height: 40px;
				border-radius: 0 6px 6px 0;
			}
			.row b {
				color: var(--text-1);
				font-weight: 600;
			}
		</style>
	</head>
	<body>
		<div class="brand">
			<svg viewBox="0 0 32 32" aria-hidden="true">
				<g fill="#dfdfd6">
					<rect x="3" y="3" width="12" height="12" rx="2" />
					<rect x="17" y="3" width="12" height="12" rx="2" />
					<rect x="3" y="17" width="12" height="12" rx="2" />
				</g>
				<g fill="#5c73e7">
					<rect x="17" y="17" width="5" height="5" rx="1.25" />
					<rect x="24" y="17" width="5" height="5" rx="1.25" />
					<rect x="17" y="24" width="5" height="5" rx="1.25" />
					<rect x="24" y="24" width="5" height="5" rx="1.25" />
				</g>
			</svg>
			manby
		</div>
		<h1>Vector tiles, <span>fast</span></h1>
		<p class="pitch">
			The same tiles as tippecanoe, eight to eighteen times faster, in less memory.
		</p>
		<div class="chart">
			<div class="title">4 million points, seconds to tile</div>
			<div class="name">tippecanoe</div>
			<div class="row">
				<div class="bar" style="width: calc((100% - 120px)); background: var(--other)"></div>
				61.4 s
			</div>
			<div class="name">manby</div>
			<div class="row">
				<div
					class="bar"
					style="width: calc((100% - 120px) * 3.44 / 61.4); background: var(--brand-2)"
				></div>
				<span>3.44 s, <b>17.8x faster</b></span>
			</div>
		</div>
	</body>
</html>
