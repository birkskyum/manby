# Checks every pull request and main: the formatting, clippy on manby's code,
# tests and examples, the pages of its API, the build with the oldest Rust
# that Cargo.toml's rust-version promises, the unit tests, tippecanoe's golden
# tests as MVT and as MLT on Linux (x86-64 and ARM) and macOS, the unit and
# golden tests on Windows, the Python module and the R package on Linux and
# Windows, the R package in webR, and the site.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.100.0

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.100.0 --profile minimal --component clippy
      - uses: Swatinem/rust-cache@v2
      - name: Lint manby's code, tests and examples, which also builds them
        run: cargo clippy --locked --features mlt,remote -p manby --all-targets --no-deps -- -D warnings
      - name: Build the API's pages, with their links checked
        run: cargo doc --locked --features mlt,remote -p manby --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build with the rust-version of Cargo.toml
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal
          RUSTUP_TOOLCHAIN="$msrv" cargo check --locked --features remote

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.100.0 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: make test
      - run: make test-golden-mlt

  # The golden tests run in Git's bash, with Unix line endings in the files
  # they compare.
  windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.100.0 --profile minimal --component clippy
      - uses: Swatinem/rust-cache@v2
      - name: Lint manby's Windows code
        run: cargo clippy --locked --features mlt,remote -p manby --all-targets --no-deps -- -D warnings
      - run: cargo test --locked --release --no-fail-fast
      - run: command -v make || choco install make --no-progress
      - run: make test-golden

  python:
    name: ${{ matrix.os == 'windows-2025' && 'python (windows)' || 'python' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.100.0 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uvx --from 'maturin>=1.9,<2' maturin build --out dist
      - run: |
          uv venv
          uv pip install dist/*.whl duckdb geopandas polars pyarrow shapely
          py=.venv/bin/python
          [ -e $py ] || py=.venv/Scripts/python.exe
          $py tests/python/test_tile.py

  r:
    name: ${{ matrix.os == 'windows-2025' && 'r (windows)' || 'r' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.100.0 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: r
        env:
          MANBY_BINARY: ${{ github.workspace }}/target/debug/manby${{ runner.os == 'Windows' && '.exe' || '' }}

  # The source package for CRAN, with manby and its crates vendored, made
  # once, as the one submitted is.
  cran-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
      - run: python3 r/tools/cran.py
      - uses: actions/upload-artifact@v7
        with:
          name: cran-package
          path: manby_*.tar.gz

  # That package, checked as CRAN checks it on the platforms CRAN builds for,
  # with the oldest rustc that CRAN's machines have. Linux also builds the
  # PDF manual, as CRAN does, and checks with R's development version, as
  # CRAN checks new packages.
  cran:
    name: cran (${{ matrix.os }}${{ matrix.r == 'devel' && ', r-devel' || '' }})
    needs: cran-package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]
        r: [release]
        include:
          - os: ubuntu-24.04
            r: devel
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: 1.91.1
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.91.1 --profile minimal --target x86_64-pc-windows-gnu
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: any::rcmdcheck any::testthat any::withr any::sf any::dplyr
          needs: check
          # r-devel has no binaries, and arrow and duckdb take an hour to build,
          # so there the tests that need them skip
          dependencies: ${{ matrix.r == 'devel' && '"hard"' || '"all"' }}
      - if: runner.os == 'Linux'
        uses: r-lib/actions/setup-tinytex@v2
      - if: runner.os == 'Linux'
        run: tlmgr install inconsolata
      - uses: actions/download-artifact@v8
        with:
          name: cran-package
      - name: R CMD check --as-cran
        run: Rscript -e 'rcmdcheck::rcmdcheck(Sys.glob("manby_*.tar.gz"), args = c("--as-cran", if (Sys.info()[["sysname"]] != "Linux") "--no-manual"), error_on = "warning", check_dir = "check")'
        env:
          _R_CHECK_CRAN_INCOMING_REMOTE_: false
          _R_CHECK_FORCE_SUGGESTS_: false
      - if: failure()
        run: cat check/manby.Rcheck/00install.out || true
      # LaTeX's errors, which R CMD check doesn't show
      - if: failure() && runner.os == 'Linux'
        working-directory: check
        run: |
          [ -f manby-manual.tex ] || exit 0
          TEXINPUTS=".:$(R RHOME)/share/texmf/tex/latex:" pdflatex -interaction=nonstopmode manby-manual.tex >/dev/null || true
          grep -n -A8 '^!' manby-manual.log || tail -40 manby-manual.log

  # The R package as R-universe builds it for webR, with manby from this
  # commit, and its tests run in webR in Node.js.
  webr:
    runs-on: ubuntu-24.04
    container: ghcr.io/r-wasm/webr:main
    steps:
      - uses: actions/checkout@v7
      - name: Build the R package for webR
        run: |
          export PATH=/opt/R/current/bin:$PATH
          R CMD build --no-build-vignettes --no-manual r
          mkdir webr-repo
          MANBY_SOURCE=$GITHUB_WORKSPACE PKG_SYSREQS=false R -q -e "rwasm::build(paste0('./', Sys.glob('manby_*.tar.gz')), out_dir = 'webr-repo')"
      - name: Run its tests in webR
        working-directory: tests/webr
        run: |
          npm ci --no-audit --no-fund
          node run.mjs ../../webr-repo/manby_*.tgz

  site:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
