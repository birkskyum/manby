[package]
name = "manby"
version = "0.1.0"
edition = "2024"
description = "Builds vector tilesets from geographic features, like tippecanoe, several times faster"
license = "BSD-2-Clause"

[dependencies]
flate2 = { version = "1.1", default-features = false, features = ["zlib"] }
libc = "0.2.191"
libdeflater = "1.26.1"
memmap2 = "0.9.12"
mlt-core = { version = "0.22.0", optional = true }
tikv-jemallocator = "0.6"
rayon = "1.12.0"
rusqlite = { version = "0.40", features = ["bundled"] }
tippecanoe = { version = "2.82.0", path = "../tippecanoe-rs" }
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }

[features]
# MapLibre Tile output (`--tile-format=mlt`). mlt-core needs Rust 1.98:
# cargo +1.98.1 build --release --features mlt
mlt = ["dep:mlt-core"]

[[example]]
name = "mlt_sizes"
required-features = ["mlt"]

[[example]]
name = "mlt_verify"
required-features = ["mlt"]

[[example]]
name = "mlt_reader_check"
required-features = ["mlt"]

[profile.release]
debug = 1
lto = "thin"
codegen-units = 1
