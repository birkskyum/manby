# Checks every pull request and main: the formatting, clippy on manby's code,
# tests and examples, the pages of its API, the build with the oldest Rust
# that Cargo.toml's rust-version promises, the unit tests, tippecanoe's golden
# tests as MVT and as MLT on Linux (x86-64 and ARM) and macOS, the unit and
# golden tests on Windows, the Python module and the R package on Linux and
# Windows, the R package in webR, and the site.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.98.1

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.98.1 --profile minimal --component clippy
      - uses: Swatinem/rust-cache@v2
      - name: Lint manby's code, tests and examples, which also builds them
        run: cargo clippy --locked --features mlt,remote -p manby --all-targets --no-deps -- -D warnings
      - name: Build the API's pages, with their links checked
        run: cargo doc --locked --features mlt,remote -p manby --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build with the rust-version of Cargo.toml
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal
          RUSTUP_TOOLCHAIN="$msrv" cargo check --locked --features remote

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.98.1 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: make test
      - run: make test-golden-mlt

  # The golden tests run in Git's bash, with Unix line endings in the files
  # they compare.
  windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.98.1 --profile minimal --component clippy
      - uses: Swatinem/rust-cache@v2
      - name: Lint manby's Windows code
        run: cargo clippy --locked --features mlt,remote -p manby --all-targets --no-deps -- -D warnings
      - run: cargo test --locked --release --no-fail-fast
      - run: command -v make || choco install make --no-progress
      - run: make test-golden

  python:
    name: ${{ matrix.os == 'windows-2025' && 'python (windows)' || 'python' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.98.1 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uvx --from 'maturin>=1.9,<2' maturin build --out dist
      - run: |
          uv venv
          uv pip install dist/*.whl duckdb geopandas polars pyarrow shapely
          py=.venv/bin/python
          [ -e $py ] || py=.venv/Scripts/python.exe
          $py tests/python/test_tile.py

  r:
    name: ${{ matrix.os == 'windows-2025' && 'r (windows)' || 'r' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.98.1 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: r
        env:
          MANBY_BINARY: ${{ github.workspace }}/target/debug/manby${{ runner.os == 'Windows' && '.exe' || '' }}

  # The R package as R-universe builds it for webR, with manby from this
  # commit, and its tests run in webR in Node.js.
  webr:
    runs-on: ubuntu-24.04
    container: ghcr.io/r-wasm/webr:main
    steps:
      - uses: actions/checkout@v7
      - name: Build the R package for webR
        run: |
          export PATH=/opt/R/current/bin:$PATH
          R CMD build --no-build-vignettes --no-manual r
          MANBY_SOURCE=$GITHUB_WORKSPACE PKG_SYSREQS=false R -q -e "rwasm::build(paste0('./', Sys.glob('manby_*.tar.gz')), out_dir = 'webr-repo')"
      - name: Run its tests in webR
        working-directory: tests/webr
        run: |
          npm ci --no-audit --no-fund
          node run.mjs ../../webr-repo

  site:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
