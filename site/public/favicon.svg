			.tile { fill: #dfdfd6; }
			.split { fill: #5c73e7; }
		}
	</style>
	<rect class="tile" x="3" y="3" width="12" height="12" rx="2" />
	<rect class="tile" x="17" y="3" width="12" height="12" rx="2" />
	<rect class="tile" x="3" y="17" width="12" height="12" rx="2" />
	<rect class="split" x="17" y="17" width="5" height="5" rx="1.25" />
	<rect class="split" x="24" y="17" width="5" height="5" rx="1.25" />
	<rect class="split" x="17" y="24" width="5" height="5" rx="1.25" />
	<rect class="split" x="24" y="24" width="5" height="5" rx="1.25" />
</svg>
