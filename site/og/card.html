<!doctype html>
<!--
	The social card for links to the site (public/og.png) and the GitHub
	repository (og/github-social.png). og/render.sh screenshots it with
	headless Chrome at the size each needs; the layout follows the window.
	It is made to read at a glance at phone size, where a feed shows it about
	360 pixels wide. Colors are the site's dark theme, from
	src/styles/tokens.css.
-->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>manby card</title>
		<style>
			@font-face {
				font-family: 'Inter';
				src: url('../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2')
					format('woff2');
				font-weight: 100 900;
			}
			:root {
				--bg: #1b1b1f;
				--text-1: #dfdfd6;
				--text-2: #98989f;
				--brand-1: #a8b1ff;
				--brand-2: #5c73e7;
				--other: #898781;
			}
			* {
				box-sizing: border-box;
				margin: 0;
			}
			html,
			body {
				width: 100vw;
				height: 100vh;
				overflow: hidden;
				color: var(--text-1);
				font-family: 'Inter', sans-serif;
			}
			body {
				display: grid;
				grid-template-columns: 1fr 1fr;
				column-gap: 64px;
				padding: 60px 72px;
				background:
					radial-gradient(60% 80% at 92% 8%, rgba(92, 115, 231, 0.22), transparent 70%),
					var(--bg);
			}
			.text {
				display: flex;
				flex-direction: column;
			}
			.brand {
				display: flex;
				align-items: center;
				gap: 16px;
				font-size: 40px;
				font-weight: 650;
				letter-spacing: -0.01em;
			}
			.brand svg {
				width: 52px;
				height: 52px;
			}
			h1 {
				margin-top: auto;
				font-size: 80px;
				line-height: 1.02;
				font-weight: 760;
				letter-spacing: -0.03em;
				text-wrap: balance;
			}
			h1 span {
				color: var(--brand-1);
			}
			.sub {
				margin-top: 24px;
				font-size: 36px;
				line-height: 1.25;
				color: var(--text-2);
				text-wrap: balance;
			}
			.sub span {
				white-space: nowrap;
			}
			.chart {
				align-self: end;
				display: flex;
				flex-direction: column;
				font-variant-numeric: tabular-nums;
			}
			.chart .title {
				font-size: 32px;
				color: var(--text-2);
			}
			.label {
				display: flex;
				justify-content: space-between;
				align-items: baseline;
				margin-top: 30px;
				font-size: 54px;
				font-weight: 600;
				letter-spacing: -0.015em;
			}
			.label .value {
				font-weight: 500;
				color: var(--text-2);
			}
			.bar {
				margin-top: 12px;
				height: 48px;
				border-radius: 0 8px 8px 0;
			}
		</style>
	</head>
	<body>
		<div class="text">
			<div class="brand">
				<svg viewBox="0 0 32 32" aria-hidden="true">
					<g fill="#dfdfd6">
						<rect x="3" y="3" width="12" height="12" rx="2" />
						<rect x="17" y="3" width="12" height="12" rx="2" />
						<rect x="3" y="17" width="12" height="12" rx="2" />
					</g>
					<g fill="#5c73e7">
						<rect x="17" y="17" width="5" height="5" rx="1.25" />
						<rect x="24" y="17" width="5" height="5" rx="1.25" />
						<rect x="17" y="24" width="5" height="5" rx="1.25" />
						<rect x="24" y="24" width="5" height="5" rx="1.25" />
					</g>
				</svg>
				manby
			</div>
			<h1><span>8 to 18×</span> faster than tippecanoe</h1>
			<p class="sub"><span>Same options.</span> <span>Same tiles.</span> <span>Less memory.</span></p>
		</div>
		<div class="chart">
			<div class="title">Tiling 4 million points</div>
			<div class="label">tippecanoe <span class="value">61.4 s</span></div>
			<div class="bar" style="width: 100%; background: var(--other)"></div>
			<div class="label">manby <span class="value">3.44 s</span></div>
			<div class="bar" style="width: calc(100% * 3.44 / 61.4); background: var(--brand-2)"></div>
		</div>
	</body>
</html>
