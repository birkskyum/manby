# Weekly dependency updates, grouped. Minor and patch updates merge themselves
# once the checks pass (workflows/automerge.yml), and major ones wait for review.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        update-types: [minor, patch]
    ignore:
      # h3o 0.9.5 and later need Rust 1.94, above manby's rust-version
      - dependency-name: h3o
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
    commit-message:
      prefix: ci
      include: scope
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    groups:
      site:
        update-types: [minor, patch]
    commit-message:
      prefix: docs
      include: scope
