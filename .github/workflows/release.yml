# Releases manby. On each push to main, release-plz opens or updates the release
# PR, with the versions and the changelog that the merged PR titles call for
# (release-plz.toml). Merging that PR publishes the crates that changed to
# crates.io, and tags and makes manby's GitHub release. The jobs after that build
# manby for macOS and Linux, run each build on its own platform, and publish the
# wheels to PyPI and the binaries to the release. Run by hand, it only builds
# and runs.
#
# crates.io and PyPI trust this workflow in the `release` environment, so no
# tokens are kept here.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # zlib's exact output decides which features a tile near the size limit keeps,
  # so every build has the same zlib, built in.
  LIBZ_SYS_STATIC: '1'

jobs:
  release-pr:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
      pull-requests: write
    concurrency:
      group: release-pr
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install 1.98.1 --profile minimal && rustup default 1.98.1
      - uses: release-plz/action@v0.5
        id: release-plz
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # A PR that this workflow's token opens or updates starts no workflows, so
      # its checks are started here.
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.release-plz.outputs.pr }}
        run: |
          branch=$(jq -r '.head_branch // empty' <<< "${PR:-null}")
          if [ -n "$branch" ]; then
            gh workflow run ci.yml -R "$GITHUB_REPOSITORY" --ref "$branch"
            gh workflow run pr-title.yml -R "$GITHUB_REPOSITORY" --ref "$branch"
          fi

  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
    outputs:
      tag: ${{ steps.manby.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install 1.98.1 --profile minimal && rustup default 1.98.1
      - uses: release-plz/action@v0.5
        id: release-plz
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - id: manby
        env:
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          tag=$(jq -r '.[] | select(.package_name == "manby") | .tag' <<< "${RELEASES:-[]}")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.target }}
    needs: release
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release.outputs.tag != '') }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-26
          - target: x86_64-apple-darwin
            runner: macos-26
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            manylinux: '2_28'
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04
            manylinux: '2_28'
            # jemalloc for pages up to 64 kB, so it runs on kernels with 16 kB
            # pages, such as Asahi's
            docker: -e JEMALLOC_SYS_WITH_LG_PAGE=16
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            manylinux: musllinux_1_2
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04
            manylinux: musllinux_1_2
            docker: -e JEMALLOC_SYS_WITH_LG_PAGE=16
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag || github.sha }}
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          docker-options: -e LIBZ_SYS_STATIC=1 ${{ matrix.docker }}
          rust-toolchain: 1.98.1
          maturin-version: v1.16.0
          args: --release --locked --out dist
      - name: Binary
        run: |
          d=manby-${{ matrix.target }}
          mkdir $d
          unzip -j dist/*.whl '*.data/scripts/manby' -d $d
          chmod +x $d/manby
          cp LICENSE.md README.md $d/
          tar -czf $d.tar.gz $d
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl
      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.target }}
          path: manby-${{ matrix.target }}.tar.gz

  run:
    name: run ${{ matrix.target }}
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-26
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: bin-${{ matrix.target }}
      - name: Tile
        run: |
          tar -xzf manby-${{ matrix.target }}.tar.gz
          m=./manby-${{ matrix.target }}/manby
          $m --version
          cat > in.geojson <<'EOF'
          {"type":"Feature","properties":{"n":1},"geometry":{"type":"Point","coordinates":[11.4,48.2]}}
          {"type":"Feature","properties":{"n":2},"geometry":{"type":"LineString","coordinates":[[11.4,48.2],[11.5,48.3]]}}
          EOF
          $m -q -z8 -o out.pmtiles in.geojson
          $m -q -z8 --tile-format=mlt -o out-mlt.pmtiles in.geojson
          ls -l out.pmtiles out-mlt.pmtiles

  pypi:
    needs: [release, run]
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

  binaries:
    needs: [release, run]
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          path: bin
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          cd bin
          sha256sum *.tar.gz > SHA256SUMS
          gh release upload "$TAG" *.tar.gz SHA256SUMS --clobber -R "$GITHUB_REPOSITORY"
